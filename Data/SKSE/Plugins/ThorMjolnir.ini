[Controls]
; Device for the throw/recall button (a single tap throws or recalls).
; Supported values: Keyboard, Mouse, Gamepad.
AimDevice = Keyboard

; Button code within the chosen device.
;   - Keyboard: DirectInput scan code (default 34 = G key).
;   - Mouse: 0 = left button, 1 = right button, 2 = middle button,
;     3-7 = extra mouse buttons.
;   - Gamepad: standard SKSE gamepad button code.
AimKeyCode = 34

[Throw]
; Initial speed of the thrown weapon, in game units per second.
; Range 1000 - 15000.
Speed = 5000.0
; How strongly gravity pulls the weapon down, as a fraction of the world's
; gravity. 0.35 = same as vanilla arrows. 0.0 = no drop at all.
; Range 0.0 - 2.0.
GravityMultiplier = 0.35

[Damage]
; Fraction of the weapon's real hit damage (as a normal melee hit with
; it: perks, target armor, sneak, criticals) dealt by the thrown weapon.
; 1.0 = 100%. Range 0.0 - 2.0.
; Initial hit when the weapon strikes an actor on the throw.
ThrowHitMultiplier = 0.75
; Each hit while the weapon flies back to the hand.
ReturnHitMultiplier = 0.25

; Whether each hit while the weapon flies back staggers the target.
; (The initial hit never staggers: the target is paralyzed instead.)
ReturnStagger = true

; Whether the throw leaves an electric discharge on impact.
; HazardOnActor: when the weapon sticks into an actor. This discharge IS
;   the continuous damage while the weapon stays stuck: turning it off
;   leaves only the initial hit.
; HazardOnSurface: when the weapon sticks into a wall, the ground, etc.
HazardOnActor = true
HazardOnSurface = true

; Whether every impact of the throw (enemy or surface) plays the lightning
; explosion.
ImpactExplosion = true

[VFX]
; Purely visual effects. true = enabled, false = disabled.
; Changes apply to the next throw or recall, not to one already in flight.
; Lightning trail behind the weapon while it flies.
Trail = true
; Sparks around the weapon while it moves.
Particles = true
; Glow around the hammer head from the throw until it is caught
; (ThorMjolnirLight.nif).
WeaponLight = true
; Brief glow on your hands when you throw.
HandEffect = true
; Sparks, hammer glow and light during every power attack with the weapon
; in hand. Independent from the throw effects above.
PowerAttackEffects = true

; Sparks (throw and power attacks), relative to the original mesh
; (1.0 = 100%). Apply live.
; Sparks emitted per second. Range 0.1 - 2.0. Combined with a long
; lifetime, very high values are capped by the mesh's particle limit.
ParticleAmount = 1.0
; How long each spark lasts. Range 0.25 - 2.0.
ParticleLifetime = 1.0

; Glow of the hammer's own texture (in hand and while thrown). Applies live.
; GlowMode: Off, Constant or Pulse.
GlowMode = Constant
; GlowCondition: Always, or NearCreatures (only while a living creature of
; the enabled types below is within GlowRadius; the glow fades in and out).
GlowCondition = Always
GlowNearDragons = true
GlowNearUndead = true
GlowNearDaedra = true
; Detection distance in game units. Range 500 - 8000.
GlowRadius = 2000.0
; Brightness relative to the original mesh (1.0 = 100%). Range 0.0 - 3.0.
; In Pulse mode, this is the peak.
GlowIntensity = 1.0
; Pulses per second (Pulse mode only). Range 0.1 - 5.0.
GlowPulseSpeed = 1.0

; Camera jolt when the weapon lands back in your hand, like a blow to the
; forehead: the camera snaps upwards, then springs back and forth, each time
; less, until it settles. Applies live. (VR: the vanilla camera shake is used.)
CameraShake = true
; Upward angle of the initial jolt, in degrees. Range 1 - 20.
CameraShakeAngle = 6.0
; Time until the bounces die out, in seconds. Range 0.2 - 3.0.
CameraShakeDuration = 1.0
; Back-and-forth movements per second after the jolt. Range 1 - 8.
CameraShakeFrequency = 3.0

[Debug]
; Writes a performance line to ThorMjolnir_OAR.log every 10 seconds: time the
; mod spends per frame (average and peak), frame time, and active loops and
; timers. For diagnostics only; leave it off for normal play.
PerformanceLog = false
