[Controls]
; Device for the throw/recall button (a single tap throws or recalls).
; Supported values: Keyboard, Mouse, Gamepad.
AimDevice = Keyboard

; Button code within the chosen device.
;   - Keyboard: DirectInput scan code (default 34 = G key).
;   - Mouse: 0 = left button, 1 = right button, 2 = middle button,
;     3-7 = extra mouse buttons.
;   - Gamepad: standard SKSE gamepad button code.
AimKeyCode = 34

[Throw]
; Initial speed of the thrown weapon, in game units per second.
; Range 1000 - 15000.
Speed = 5000.0
; How strongly gravity pulls the weapon down, as a fraction of the world's
; gravity. 0.35 = same as vanilla arrows. 0.0 = no drop at all.
; Range 0.0 - 2.0.
GravityMultiplier = 0.35

[Damage]
; Fraction of the weapon's real hit damage (as a normal melee hit with
; it: perks, target armor, sneak, criticals) dealt by the thrown weapon.
; 1.0 = 100%. Range 0.0 - 2.0.
; Initial hit when the weapon strikes an actor on the throw.
ThrowHitMultiplier = 0.75
; Each hit while the weapon flies back to the hand.
ReturnHitMultiplier = 0.25

; Whether each hit while the weapon flies back staggers the target.
; (The initial hit never staggers: the target is paralyzed instead.)
ReturnStagger = true

; Whether the throw leaves an electric discharge on impact.
; HazardOnActor: when the weapon sticks into an actor. This discharge IS
;   the continuous damage while the weapon stays stuck: turning it off
;   leaves only the initial hit.
; HazardOnSurface: when the weapon sticks into a wall, the ground, etc.
HazardOnActor = true
HazardOnSurface = true

; Whether every impact of the throw (enemy or surface) plays the lightning
; explosion.
ImpactExplosion = true

[VFX]
; Purely visual effects. true = enabled, false = disabled.
; Changes apply to the next throw or recall, not to one already in flight.
; Lightning trail behind the weapon while it flies.
Trail = true
; Sparks around the weapon while it moves.
Particles = true
; Glow around the hammer head from the throw until it is caught
; (ThorMjolnirLight.nif).
WeaponLight = true
; Brief glow on your hands when you throw.
HandEffect = true
