[Controls]
; Device for the aim/throw/recall button.
; Supported values: Keyboard, Mouse, Gamepad.
AimDevice = Keyboard

; Button code within the chosen device.
;   - Keyboard: DirectInput scan code (default 19 = R key).
;   - Mouse: 0 = left button, 1 = right button, 2 = middle button,
;     3-7 = extra mouse buttons.
;   - Gamepad: standard SKSE gamepad button code.
AimKeyCode = 34

[Damage]
; How the initial hit damage and the continuous electric drain are
; calculated while the weapon stays stuck in an actor (point 6 of
; Mecanica del arma.txt).
; Supported values:
;   - Direct: fixed values (HitDamage/DotDamage).
;   - Level: scales with the attacker's level (LevelHitBase/PerLevel,
;     LevelDotBase/PerLevel) -- low damage at low levels, more as the
;     level goes up.
Mode = Direct

; Direct mode: damage of the initial hit and of each drain tick.
HitDamage = 25.0
DotDamage = 6.0

; Level mode: damage = Base + PerLevel * attacker's level.
LevelHitBase = 5.0
LevelHitPerLevel = 1.5
LevelDotBase = 1.0
LevelDotPerLevel = 0.3
